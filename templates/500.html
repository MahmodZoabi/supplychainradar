<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 — Server Error · SupplyChainRadar</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 500: '#14b8a6', 600: '#0d9488' } },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center px-4">

  <div class="text-center max-w-md">

    <!-- Brand mark -->
    <div class="flex items-center justify-center gap-2 mb-10">
      <img src="/static/favicon.svg" alt="" class="w-7 h-7" />
      <span class="text-sm font-semibold text-slate-400 tracking-wide">SupplyChainRadar</span>
    </div>

    <!-- Error code -->
    <div class="text-8xl font-extrabold text-slate-800 leading-none mb-4 select-none">500</div>

    <!-- Message -->
    <h1 class="text-xl font-semibold text-white mb-2">Something went wrong</h1>
    <p class="text-sm text-slate-400 mb-8 leading-relaxed">
      An unexpected error occurred on our end. Please try again in a moment.
    </p>

    <!-- Actions -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="/"
         class="inline-flex items-center gap-2 bg-brand-500 hover:bg-brand-600 text-white font-medium text-sm
                px-5 py-2.5 rounded-xl transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Go home
      </a>
      <button onclick="location.reload()"
         class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-700
                text-slate-300 hover:text-white font-medium text-sm px-5 py-2.5 rounded-xl transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Retry
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="absolute bottom-0 left-0 right-0 py-5 text-center text-xs text-slate-700">
    SupplyChainRadar &middot; Built by
    <a href="https://github.com/MahmodZoabi" target="_blank" rel="noopener"
       class="text-slate-600 hover:text-slate-400 transition-colors">Mahmod Zoabi</a>
  </footer>

</body>
</html>
